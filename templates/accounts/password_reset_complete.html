{% extends 'base.html' %}

{% block title %}Password changed — NEXLINK{% endblock %}
{% block body_class %}auth-body{% endblock %}

{% block body %}
<div class="auth-shell auth-shell--single">
    <section class="auth-card">
        <h1>Password changed ✅</h1>
        <p class="auth-card__subtitle">Your password has been updated. Log in with your new password.</p>
        <a class="btn btn--primary btn--block" href="{% url 'accounts:login' %}">Go to login</a>
    </section>
</div>
{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}
